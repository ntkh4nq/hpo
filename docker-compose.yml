services:
  db:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: hpo
      POSTGRES_PASSWORD: hpo
      POSTGRES_DB: hpo
    ports: ["5433:5432"] # 5432 thường đã bị Postgres khác chiếm
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hpo"]
      interval: 2s
      retries: 15
  redis:
    image: redis:8 # có sẵn JSON + Search mà langgraph-checkpoint-redis cần
    command: redis-server --save "" --appendonly no # state tạm của ca, không ghi ra đĩa (T92)
    ports: ["6380:6379"] # 6379 để trống cho Redis khác trên máy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
