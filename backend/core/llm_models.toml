# Per-model request parameters that differ between providers (sent as extra_body).
# Model names are the gateway's names. Add a model here before using it.

[vlm]  # Qwen on vLLM, gateway name "vlm" (was qwen-35b); chat template switch
thinking_off = { chat_template_kwargs = { enable_thinking = false } }
thinking_on = { chat_template_kwargs = { enable_thinking = true } }

[deepseek-v4-flash]  # https://api-docs.deepseek.com/guides/thinking_mode (default: enabled)
thinking_off = { thinking = { type = "disabled" } }
thinking_on = { thinking = { type = "enabled" } }
