[project]
name = "hpo-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary]",
    "deepagents",
    "langchain-openai",
    "openpyxl>=3.1.5",
    "langfuse>=5.2",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
