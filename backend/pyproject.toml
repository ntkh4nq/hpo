[project]
name = "hpo-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary]",
    "deepagents",
    "langchain-openai",
    "openpyxl>=3.1.5",
    "langfuse>=5.2",
    "numpy>=2.5.4",
    "langgraph>=1.2.20",
    "docling>=2.150.1",
    "tokenizers>=0.23.3",
    "python-multipart>=0.0.34",
    "langgraph-checkpoint-redis>=0.6.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
